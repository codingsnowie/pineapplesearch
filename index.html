      #container {

      }

        margin-bottom: 8px;

      .subtitle {

      }
      #search-row {

        gap: 8px;
        width: 100%;
        margin-bottom: 28px;
      }
      #query {
        flex: 1;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f1f5f9;
        font-size: 1rem;
        outline: none;
        min-width: 0;
        font-family: inherit;
      }
      #query::placeholder {
        color: #475569;
      }
      #query:focus {

      }
      button {
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }
      button:hover {
        background: #4f46e5;
      }
      #results {
        width: 100%;
        text-align: left;
      }
      .no-result {
        color: #94a3b8;
        text-align: center;
        padding: 20px;
      }
      .match-count {
        font-size: 0.8rem;
        color: #64748b;
        margin-bottom: 12px;
        text-align: right;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 12px;
      }
      .card-name {
        font-size: 1.1rem;
        font-weight: 700;
        color: #f1f5f9;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        font-size: 0.875rem;
      }
      .row.border-b {
        border-bottom: 1px solid #263348;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #94a3b8;
      }
      .label img {
        border-radius: 3px;
      }
      a {
        color: #818cf8;
        text-decoration: none;
        font-weight: 500;
      }
      a:hover {
        text-decoration: underline;
      }
      .empty {
        color: #475569;
        font-style: italic;
      }
      .chess-section {
        padding: 8px 0;
        font-size: 0.875rem;
      }
      .chess-header {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #94a3b8;
      }
      .chess-links {
        margin-left: 26px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 4px;
      }
      .chess-single {
        margin-left: 26px;
        margin-top: 2px;
      }
    </style>

            chessHtml = '<span class="empty">—</span>';
          } else if (accounts.length === 1) {
            chessHtml = '<div class="chess-single"><a href="https://www.chess.com/member/' + encodeURIComponent(accounts[0]) + '" target="_blank">' + escHtml(accounts[0]) + '</a></div>';
          } else {
            chessHtml = '<div class="chess-links">' + accounts.map(u =>
              '<a href="https://www.chess.com/member/' + encodeURIComponent(u) + '" target="_blank">' + escHtml(u) + '</a>'
            ).join('') + '</div>';
          }

          html += \`
      <div class="card">
        <div class="card-name">\${escHtml(p.name)}</div>
        <div class="row border-b">
          <span class="label">
            <img src="https://www.google.com/s2/favicons?domain=fide.com&sz=32" alt="FIDE" width="18" height="18">
            FIDE ID
          </span>
          <span>\${p.fideId
            ? '<a href="https://ratings.fide.com/profile/' + encodeURIComponent(p.fideId) + '" target="_blank">' + escHtml(p.fideId) + '</a>'
            : '<span class="empty">—</span>'
          }</span>
        </div>
        <div class="chess-section">
          <div class="chess-header">
            <img src="https://www.google.com/s2/favicons?domain=chess.com&sz=32" alt="Chess.com" width="18" height="18">
            Chess.com
          </div>
          \${chessHtml}
        </div>
      </div>\`;
        }

        out.innerHTML = html;
      }

      function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
    </script>
  </body>
</html>
